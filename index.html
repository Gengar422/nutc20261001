<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分比寬度示範</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .parent {
      width: 80%;
      background-color: #e3f2fd;
      padding: 20px;
      border: 2px solid #1976d2;
      margin-bottom: 20px;
    }
    .child {
      width: 50%;
      background-color: #c8e6c9;
      padding: 20px;
      border: 2px solid #388e3c;
      margin-top: 10px;
    }
    .grandchild {
      width: 50%;
      background-color: #fff9c4;
      padding: 20px;
      border: 2px solid #fbc02d;
      margin-top: 10px;
    }

     <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 32px;
      color: #17324d;
    }

    .parent {
      width: 80%;
      padding: 20px;
      background: #dceef5;
      border: 3px solid #286c86;
    }


  </style>
  </style>
</head>
<body>
  <h1>百分比寬度看父元素</h1>
  <p>每一層的 50%，都以自己的父元素內容寬度為基準。</p>

  <div class="parent">
    父元素：頁面的 80%
    <div class="child">
      子元素：父元素的 50%
      <div class="grandchild">
        孫元素：子元素的 50%
      </div>
    </div>
  </div>
</body>
</html>
